<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Meet</title>
    <style>
        body {
            font-family: Poppins, sans-serif;
            background: #e5ddd5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .app {
            width: 100%;
            max-width: 430px;
            height: 95vh;
            background: white;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
        }
        
        .center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            color: #444;
        }
        
        .hidden {
            display: none;
        }
        
        .top {
            background: #075e54;
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .profile img,
        .profile .fallback {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
            background: #25d366;
            color: white;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            background: #25d366;
            border-radius: 50%;
        }
        
        .call-btns button {
            border: none;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .chat-area {
            flex: 1;
            background: #efeae2;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .bubble-left,
        .bubble-right {
            padding: 8px 12px;
            border-radius: 10px;
            max-width: 72%;
            font-size: 14px;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }
        
        .bubble-left {
            background: white;
            align-self: flex-start;
            border: 1px solid #ddd;
        }
        
        .bubble-right {
            background: #dcf8c6;
            align-self: flex-end;
        }
        
        .preview-img {
            width: 150px;
            border-radius: 8px;
            margin-top: 4px;
        }
        
        .chat-input {
            display: flex;
            padding: 8px;
            gap: 6px;
            background: white;
            border-top: 1px solid #ddd;
            align-items: center;
        }
        
        .chat-input input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }
        
        .chat-input input[type="file"] {
            width: 34px;
        }
        
        .tick {
            font-size: 13px;
            color: #075e54;
            margin-top: 2px;
            text-align: right;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px)
            }
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }
        
        #typingAnim {
            font-size: 13px;
            color: #555;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="app">
        <div class="center" id="welcome">Welcome ♥️</div>

        <div class="center hidden" id="myNameForm">
            <div style="width:100%;padding:20px">
                <input type="text" id="myName" placeholder="Enter your name"><br><br>
                <input type="file" id="myPic" accept="image/*"><br><br>
                <button onclick="saveMy()">Continue</button>
            </div>
        </div>

        <div class="center hidden" id="otherNameForm">
            <div style="width:100%;padding:20px">
                <input type="text" id="otherNameInput" placeholder="Enter friend name"><br><br>
                <input type="file" id="otherPic" accept="image/*"><br><br>
                <button onclick="saveFriend()">Enter Dashboard</button>
            </div>
        </div>

        <div id="dashboard" class="hidden">
            <div class="top">
                <div class="profile">
                    <div class="fallback" id="otherFallback">?</div>
                    <img id="otherUserImg" class="hidden">
                    <span id="topUserName">User</span>
                    <div class="status-dot"></div>
                </div>
                <div class="call-btns">
                    <button onclick="audioUI()">📞</button>
                    <button onclick="videoUI()">🎥</button>
                </div>
            </div>

            <div class="chat-area" id="chatBox"></div>
            <div id="typingAnim"></div>

            <div class="chat-input">
                <input type="text" id="msg" placeholder="Type a message">
                <input type="file" id="imgSend" accept="image/*">
                <button onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                document.getElementById("welcome").classList.add("hidden");
                document.getElementById("myNameForm").classList.remove("hidden");
            }, 1200);

            window.socket = io("http://localhost:3000");

            socket.on("message", m => {
                const chatBox = document.getElementById("chatBox");
                if (m.img) {
                    chatBox.innerHTML += `<div class="bubble-left"><b>${m.from}:</b><br><img class="preview-img" src="${m.img}"></div>`;
                } else {
                    chatBox.innerHTML += `<div class="bubble-left"><b>${m.from}:</b> ${m.text}</div>`;
                }
            });

            socket.on("typing", n => {
                document.getElementById("typingAnim").innerText = n + " typing...";
                setTimeout(() => document.getElementById("typingAnim").innerText = "", 1000);
            });

        });

        let myname = "";

        function saveMy() {
            const nameInput = document.getElementById("myName").value.trim();
            const file = document.getElementById("myPic").files[0];
            if (nameInput) {
                myname = nameInput;
                if (file) {
                    const r = new FileReader();
                    r.onload = () => socket.emit("join", {
                        name: myname,
                        img: r.result
                    });
                    r.readAsDataURL(file);
                } else {
                    socket.emit("join", {
                        name: myname
                    });
                }
                document.getElementById("myNameForm").classList.add("hidden");
                document.getElementById("otherNameForm").classList.remove("hidden");
            }
        }

        function saveFriend() {
            const fname = document.getElementById("otherNameInput").value.trim();
            const file = document.getElementById("otherPic").files[0];
            if (fname) {
                if (file) {
                    const r = new FileReader();
                    r.onload = () => {
                        socket.emit("setUser", {
                            from: fname,
                            img: r.result
                        });
                        document.getElementById("otherUserImg").src = r.result;
                        document.getElementById("otherUserImg").classList.remove("hidden");
                        document.getElementById("otherFallback").classList.add("hidden");
                        document.getElementById("topUserName").innerText = fname;
                    };
                    r.readAsDataURL(file);
                } else {
                    document.getElementById("otherFallback").innerText = fname.charAt(0).toUpperCase();
                    document.getElementById("topUserName").innerText = fname;
                    socket.emit("setUser", {
                        from: fname
                    });
                }
                document.getElementById("otherNameForm").classList.add("hidden");
                document.getElementById("dashboard").classList.remove("hidden");
            }
        }

        function sendMsg() {
            const text = document.getElementById("msg").value.trim();
            const file = document.getElementById("imgSend").files[0];
            const chatBox = document.getElementById("chatBox");

            if (file) {
                const r = new FileReader();
                r.onload = () => {
                    chatBox.innerHTML += `<div class="bubble-right"><b>${myname}:</b><br><img class="preview-img" src="${r.result}"><div class="tick">✓✓</div></div>`;
                    socket.emit("message", {
                        from: myname,
                        img: r.result
                    });
                };
                r.readAsDataURL(file);
            } else if (text) {
                chatBox.innerHTML += `<div class="bubble-right"><b>${myname}:</b> ${text}<div class="tick">✓✓</div>`;
                socket.emit("message", {
                    from: myname,
                    text
                });
            }

            document.getElementById("msg").value = "";
            document.getElementById("imgSend").value = "";
        }

        function audioUI() {
            document.getElementById("ringing").classList.remove("hidden");
            document.getElementById("ringText").innerText = "Audio Calling...";
        }

        function videoUI() {
            document.getElementById("ringing").classList.remove("hidden");
            document.getElementById("ringText").innerText = "Video Calling...";
        }

        function acceptCall() {
            document.getElementById("ringing").classList.add("hidden");
            alert("Call Connected");
        }
    </script>

</body>

</html>
